<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130"><style>
.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.ant{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.arm{transform-box:view-box;transform-origin:86px 94px;animation:wave .6s ease-in-out infinite alternate}@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.tilt{transform-box:view-box;transform-origin:60px 78px;animation:tilt 2.4s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
</style>
<g class="bob">
<rect x="19" y="86" width="13" height="30" rx="6.5" fill="#eef1f8" stroke="#9aa5c4"/>
<g class="arm"><path d="M86 94 L106 72" stroke="#9aa5c4" stroke-width="14" stroke-linecap="round"/><path d="M86 94 L106 72" stroke="#eef1f8" stroke-width="12" stroke-linecap="round"/><circle cx="109" cy="68" r="8.5" fill="#eef1f8" stroke="#9aa5c4"/></g>
<rect x="34" y="82" width="52" height="42" rx="16" fill="#7c3aed"/>
<path d="M60 112 C50 105 51 97 56 97 C58 97 60 98.5 60 100 C60 98.5 62 97 64 97 C69 97 70 105 60 112Z" fill="#fff" opacity=".92"/>
<rect x="52" y="74" width="16" height="10" rx="4" fill="#aab3cc"/>
<g class="tilt">
<line x1="60" y1="22" x2="60" y2="10" stroke="#aab3cc" stroke-width="3" stroke-linecap="round"/>
<circle class="ant" cx="60" cy="7" r="5" fill="#ff7a8a"/>
<rect x="14" y="40" width="12" height="22" rx="6" fill="#7c3aed"/><rect x="94" y="40" width="12" height="22" rx="6" fill="#7c3aed"/>
<rect x="22" y="21" width="76" height="58" rx="22" fill="#eef1f8" stroke="#9aa5c4" stroke-width="1.5"/>
<rect x="30" y="30" width="60" height="40" rx="16" fill="#1b1236"/>
<ellipse class="eye" cx="48" cy="47" rx="5.5" ry="7" fill="#7fe9ff"/><ellipse class="eye" cx="72" cy="47" rx="5.5" ry="7" fill="#7fe9ff"/><circle cx="46.5" cy="44.5" r="1.8" fill="#fff"/><circle cx="70.5" cy="44.5" r="1.8" fill="#fff"/>
<circle cx="37" cy="58" r="3.4" fill="#ff7a8a" opacity="0.5"/><circle cx="83" cy="58" r="3.4" fill="#ff7a8a" opacity="0.5"/>
<path d="M53 57 Q60 62 67 57" stroke="#7fe9ff" stroke-width="2.8" stroke-linecap="round" fill="none"/>
</g></g></svg>